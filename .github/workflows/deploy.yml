# MonlyAI CI/CD Pipeline
# Automatically build, test, and deploy to VPS on push to production branch

name: Deploy to Production

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Run tests (if exists)
        run: npm test --if-present
        continue-on-error: true

  # Job 2: Deploy to VPS (only on push to production)
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/html/monly-ai
            
            echo "📥 Pulling latest code from production branch..."
            git fetch origin
            git checkout production
            git pull origin production
            
            echo "📦 Installing dependencies..."
            npm ci --production=false
            
            echo "🏗️ Building application..."
            npm run build
            
            echo "💾 Running database migrations..."
            npm run migrate || true
            
            echo "🔄 Restarting application with PM2..."
            pm2 restart monly-ai || pm2 start npm --name "monly-ai" -- run start:unix
            
            echo "✅ Deployment complete!"
            pm2 status

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sleep 10
            if curl -s -f http://localhost:5000/api/system/status >/dev/null 2>&1; then
              echo "✅ Health check passed!"
            else
              echo "⚠️ Health check failed, checking logs..."
              pm2 logs monly-ai --lines 20
              exit 1
            fi

      - name: Notify on Success
        if: success()
        run: echo "🎉 Deployment successful!"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Deployment failed!"
